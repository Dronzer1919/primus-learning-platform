# nginx config INSIDE the frontend container. Serves the Angular SPA, compresses
# responses, and caches Angular's content-hashed assets aggressively for fast repeat
# loads. index.html is never long-cached, so new deploys are picked up immediately.
#
# It also sets the browser-enforced security headers. These are the frontend's real
# defences — unlike anything shipped in the bundle, the browser applies them before
# the app's own code gets a say, and a visitor cannot switch them off.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers -----------------------------------------------------
    # `always` so they are sent on error responses too (a 404 rendering the SPA
    # shell still needs its CSP).
    #
    # NOTE on nginx's inheritance rule: add_header directives are NOT merged
    # across levels. A location block containing even one add_header discards
    # every header set at server level, so the two location blocks below repeat
    # these. Add a header here and you must add it there too.

    # Clickjacking: this app is never meant to be framed.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Stops the browser second-guessing Content-Type — the trick that turns an
    # uploaded "image" into an executed script.
    add_header X-Content-Type-Options "nosniff" always;
    # Full URLs (which contain topic and session ids) stay off third-party
    # referers; same-origin navigation keeps them.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Features this app never uses. Denying them means a compromised dependency
    # cannot silently reach for a camera or a location.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # Content-Security-Policy — the one that matters, and the one this app cannot
    # make strict.
    #
    # 'unsafe-eval' and 'unsafe-inline' are here because they are load-bearing:
    # the playground runs the user's own JavaScript through `new Function()`, the
    # TypeScript transpiler and Pyodide both compile at runtime, and index.html
    # carries an inline theme script plus an importmap. Remove either directive
    # and the compiler — the product — stops working.
    #
    # What that costs is worth stating plainly: with 'unsafe-inline', CSP can no
    # longer block an injected <script>, so it is not a backstop against XSS
    # here. It still does real work — restricting *where* scripts, styles, fonts
    # and connections may come from, so an injected tag cannot load a payload
    # from an attacker's host or exfiltrate to one.
    #
    # The way out is architectural, not a header change: move the playground into
    # a sandboxed <iframe> (sandbox="allow-scripts", a null origin, its own
    # loose CSP), and the parent document can then drop both unsafe directives.
    # Until then this is the honest ceiling.
    #
    # Third-party origins, all deliberate:
    #   accounts.google.com  — Google Identity Services (sign-in)
    #   cdn.jsdelivr.net     — Pyodide (Python playground), loaded on demand
    #   api.primuscodex.com  — this app's API
    #   img.youtube.com      — video thumbnails on content cards
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://cdn.jsdelivr.net; script-src-elem 'self' 'unsafe-inline' https://accounts.google.com https://cdn.jsdelivr.net; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://img.youtube.com https://*.googleusercontent.com https://accounts.google.com; font-src 'self' data:; connect-src 'self' https://api.primuscodex.com https://accounts.google.com https://cdn.jsdelivr.net; frame-src 'self' https://accounts.google.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # --- Compression (big transfer-size win for JS/CSS) ---
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css application/javascript application/json
        application/manifest+json image/svg+xml application/wasm
        font/ttf font/woff font/woff2;

    # Source maps are never served. The production build does not emit them, but
    # if one ever ships by accident — a misconfigured build, a stray file in the
    # image — it would hand over readable sources and original file paths. Cheap
    # to deny, and denying it costs nothing when there is nothing to deny.
    location ~* \.map$ {
        return 404;
    }

    # --- Cache hashed static assets for a year (filenames change per build) ---
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated from server level — see the inheritance note above.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # --- SPA routing: never cache index.html; fall back to it for deep links ---
    location / {
        add_header Cache-Control "no-cache";
        # Repeated from server level — see the inheritance note above. The CSP
        # belongs on this block above all: it is the one serving the document.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://cdn.jsdelivr.net; script-src-elem 'self' 'unsafe-inline' https://accounts.google.com https://cdn.jsdelivr.net; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://img.youtube.com https://*.googleusercontent.com https://accounts.google.com; font-src 'self' data:; connect-src 'self' https://api.primuscodex.com https://accounts.google.com https://cdn.jsdelivr.net; frame-src 'self' https://accounts.google.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
        try_files $uri $uri/ /index.html;
    }
}
