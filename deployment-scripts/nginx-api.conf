# HOST Nginx site for the backend API — reverse-proxies to the lp-api container (:3100).
# Copy to:  /etc/nginx/sites-available/learning-platform-api
# Then:     sudo ln -s /etc/nginx/sites-available/learning-platform-api /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d api.primuscodex.com

server {
    listen 80;
    listen [::]:80;
    server_name api.primuscodex.com;

    # Issue-report screenshots may be up to 5MB (multer's limit in
    # backend/src/middleware/upload.js). Nginx's default is 1MB, which rejects
    # most screenshots with a 413 before the API ever sees them.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
