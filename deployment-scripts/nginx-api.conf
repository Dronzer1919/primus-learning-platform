# Nginx site config for the Node.js backend API (reverse proxy to PM2 on :3001).
# Copy to:  /etc/nginx/sites-available/learning-platform-api
# Then:     sudo ln -s /etc/nginx/sites-available/learning-platform-api /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d api.primuscodex.com

server {
    listen 80;
    listen [::]:80;
    server_name api.primuscodex.com;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
