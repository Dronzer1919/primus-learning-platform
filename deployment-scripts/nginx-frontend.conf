# HOST Nginx site for the frontend — reverse-proxies to the lp-web container (:8081),
# which serves the built Angular SPA. (Coexists with the ecom host Nginx sites.)
# Copy to:  /etc/nginx/sites-available/learning-platform-frontend
# Then:     sudo ln -s /etc/nginx/sites-available/learning-platform-frontend /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d primuscodex.com -d www.primuscodex.com

# --- www -> apex, permanently -------------------------------------------------
# Without this, both hostnames answer 200 with byte-identical content and search
# engines see two sites sharing one site's worth of signals. index.html carries a
# <link rel="canonical"> pointing at the apex, which usually resolves it — but a
# canonical is a hint and a 301 is not, so state it at the HTTP level too.
#
# `www` is deliberately absent from the server_name of the main block below:
# two server blocks on the same port cannot both claim it (nginx warns about the
# duplicate and silently uses whichever it parsed first).
#
# Still run certbot with BOTH names — this block has to serve its redirect over
# HTTPS as well, which it can only do with a certificate covering www:
#     sudo certbot --nginx -d primuscodex.com -d www.primuscodex.com
# Certbot adds the matching 443 redirect block itself.
server {
    listen 80;
    listen [::]:80;
    server_name www.primuscodex.com;
    return 301 https://primuscodex.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name primuscodex.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The container's own nginx sets CSP and the rest (frontend-nginx.conf);
        # they pass through this proxy untouched. Only HSTS belongs up here,
        # because only this hop terminates TLS.
    }

    # After certbot has created the 443 block, add HSTS to it — NOT here. A
    # browser ignores Strict-Transport-Security received over plain HTTP, so
    # setting it in this block does nothing at all:
    #
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    # Leave `preload` off until the redirect is known good on every subdomain:
    # preload lists are slow to leave, and a broken subdomain becomes unreachable
    # rather than merely insecure.
}
