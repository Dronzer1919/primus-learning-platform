# Nginx site config for the Angular frontend (SPA).
# Copy to:  /etc/nginx/sites-available/learning-platform-frontend
# Then:     sudo ln -s /etc/nginx/sites-available/learning-platform-frontend /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d primuscodex.com -d www.primuscodex.com

server {
    listen 80;
    listen [::]:80;
    server_name primuscodex.com www.primuscodex.com;

    root /var/www/learning-platform-frontend;
    index index.html;

    # Angular client-side routing: fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively (filenames change on each build)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
