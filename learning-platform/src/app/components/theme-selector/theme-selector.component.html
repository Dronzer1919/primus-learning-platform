<ion-button fill="clear" (click)="presentPopover($event)" aria-label="Choose a theme">
  <ion-icon slot="icon-only" name="color-palette-outline"></ion-icon>
</ion-button>

<ion-popover [isOpen]="isOpen" [event]="event" (didDismiss)="isOpen = false">
  <ng-template>
    <ion-content>
      <ion-list class="theme-list">
        <ion-list-header>
          <ion-label>
            <h2>Choose a Theme</h2>
            <p>Select your preferred color scheme</p>
          </ion-label>
        </ion-list-header>

        <ion-item
          *ngFor="let theme of themeService.availableThemes"
          [button]="true"
          (click)="selectTheme(theme.name)"
          [detail]="false"
        >
          <ion-icon [name]="theme.icon" slot="start"></ion-icon>
          <ion-label>
            <h3>{{ theme.label }}</h3>
            <p>{{ theme.description }}</p>
          </ion-label>
          <ion-icon *ngIf="isCurrentTheme(theme.name)" name="checkmark-circle" color="primary" slot="end"></ion-icon>
        </ion-item>
      </ion-list>
    </ion-content>
  </ng-template>
</ion-popover>
