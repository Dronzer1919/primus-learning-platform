<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Ionic App</title>

  <base href="/" />

  <!-- Resolve the bare "source-map-support" specifier that TypeScript's browser
       bundle imports to a local no-op stub, so the lazily-loaded compiler chunk
       (used by the TS playground) can load. Must precede any module scripts. -->
  <script type="importmap">
    {
      "imports": {
        "source-map-support": "./assets/shims/source-map-support.js"
      }
    }
  </script>

  <meta name="color-scheme" content="light dark" />
  <script>
    (function () {
      try {
        // Keep this list in sync with DARK_THEMES in theme.service.ts — without it a
        // dark theme flashes light on reload, before Angular boots and applies it.
        var darkThemes = ['dark', 'luminous', 'cyan'];
        var t = localStorage.getItem('app-theme');
        if (darkThemes.indexOf(t) !== -1 || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('ion-palette-dark');
        }
      } catch (e) {}
    })();
  </script>
  <!-- maximum-scale/user-scalable=no are deliberately omitted: locking zoom fails
       WCAG 1.4.4, and this app renders code listings that people do need to zoom.
       Accidental zoom on double-tap is handled with `touch-action: manipulation`
       in global.scss instead. -->
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
